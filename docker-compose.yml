services:
  nginx:
    image: nginx
    volumes:
      - ./public_html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    environment:
      - TZ=America/New_York
    depends_on:
      - php
    restart: unless-stopped

  php:
    image: php:8.3-fpm
    volumes:
      - ./public_html:/usr/share/nginx/html:ro
    environment:
      - TZ=America/New_York
    restart: unless-stopped
